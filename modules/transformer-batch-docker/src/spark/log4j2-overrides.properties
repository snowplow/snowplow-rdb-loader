# Layered over Spark's default log4j2 config by SnowplowSparkPlugin (sparkLog4jConfigFile).
# The aim is to cut per-output-file log lines, which dominate the byte count of the logs

# Executors: two INFO lines per output file. S3ABlockOutputStream still logs each written file.
logger.magictracker.name = org.apache.hadoop.fs.s3a.commit.magic.MagicCommitTracker
logger.magictracker.level = warn

# Executors: one INFO line per output file, carrying no useful information.
logger.codecpool.name = org.apache.hadoop.io.compress.CodecPool
logger.codecpool.level = warn

# Driver: keep the per-file "Committing file ... size ...: duration ..." line, so a slow commit
# stays visible, but drop the "Starting: Committing file ..." line that precedes each one.
logger.commitops.name = org.apache.hadoop.fs.s3a.commit.impl.CommitOperations
logger.commitops.filter.starting.type = RegexFilter
logger.commitops.filter.starting.regex = Starting: Committing file .*
logger.commitops.filter.starting.onMatch = DENY
logger.commitops.filter.starting.onMismatch = NEUTRAL
